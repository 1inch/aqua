# Inlined copy of 1inch/workflows/.github/workflows/dependency-audit.yaml: this repository cannot
# call that private reusable workflow. Generated by tools/dependency-audit/inline-workflow.py —
# edit the shared workflow, then regenerate; do not hand-edit this file.
# version: v0.1.0
name: Dependency Audit

on:
  schedule:
    - cron: "35 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    concurrency:
      group: dependency-audit-${{ github.repository }}
      cancel-in-progress: false
    env:
      BASE_BRANCH: main
      BRANCH: feature/DPA2-6761_weekday-caller
      TICKET: DPA2-6761
      REPO: ${{ github.repository }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TRIVY_VERSION: v0.76.0
      # Pinned: the runner is the only place the findings and the verdict are assembled, so a
      # silent minor bump would change how the agent is started.
      CURSOR_SDK_VERSION: 1.2.0
    steps:
      - name: Require secrets
        # CURSOR_API_KEY resolves to the organization secret;
        # DEPENDENCY_AUDIT_PAT is per-repository because it pushes this repository's branch.
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AUDIT_PAT: ${{ secrets.DEPENDENCY_AUDIT_PAT }}
        run: |
          missing=0
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error::Secret CURSOR_API_KEY is not set"
            missing=1
          fi
          if [ -z "$AUDIT_PAT" ]; then
            echo "::error::Secret DEPENDENCY_AUDIT_PAT is not set"
            missing=1
          fi
          exit "$missing"

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCY_AUDIT_PAT }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan lockfiles
        id: scan
        run: |
          critical_high_report="$RUNNER_TEMP/trivy-critical-high.json"
          medium_low_report="$RUNNER_TEMP/trivy-medium-low.json"

          trivy fs --scanners vuln --pkg-types library --severity CRITICAL,HIGH --ignore-unfixed \
            --format json --output "$critical_high_report" .
          trivy fs --skip-db-update --scanners vuln --pkg-types library --severity MEDIUM,LOW \
            --format json --output "$medium_low_report" .

          accepted_advisories=$(git ls-files | grep -E '(^|/)package\.json$' \
            | xargs -r -d '\n' jq -r '.pnpm.auditConfig.ignoreGhsas[]?, .pnpm.auditConfig.ignoreCves[]?' 2>/dev/null \
            | jq -R . | jq -sc 'unique')
          count_findings() {
            jq --argjson accepted "$accepted_advisories" \
              '[.Results[]?.Vulnerabilities[]? | ([.VulnerabilityID] + (.VendorIDs // [])) as $ids | select(($ids - $accepted) == $ids)] | length' "$1"
          }
          critical_high=$(count_findings "$critical_high_report")
          medium_low=$(count_findings "$medium_low_report")

          echo "critical_high=$critical_high" >> "$GITHUB_OUTPUT"
          {
            echo "TRIVY_CRITICAL_HIGH_REPORT=$critical_high_report"
            echo "TRIVY_MEDIUM_LOW_REPORT=$medium_low_report"
            echo "ACCEPTED_ADVISORIES=$accepted_advisories"
          } >> "$GITHUB_ENV"
          {
            echo "### Dependency audit"
            echo ""
            echo "| Severity | Findings |"
            echo "| --- | --- |"
            echo "| Critical and high, with a fixed version | $critical_high |"
            echo "| Medium and low | $medium_low |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect toolchains
        id: toolchains
        if: steps.scan.outputs.critical_high != '0'
        run: |
          tracked() { git ls-files | grep -Eq "(^|/)$1\$"; }

          node=false
          go=false
          rust=false
          if tracked 'pnpm-lock\.yaml'; then node=true; fi
          if tracked 'yarn\.lock'; then node=true; fi
          if tracked 'package-lock\.json'; then node=true; fi
          if tracked 'go\.mod'; then go=true; fi
          if tracked 'Cargo\.lock'; then rust=true; fi

          # Only a summary string reaches the agent; it installs the toolchains itself inside
          # its own VM, so the runner does not need them.
          summary=""
          if [ "$node" = true ]; then summary="node ${summary}"; fi
          if [ "$go" = true ]; then summary="go ${summary}"; fi
          if [ "$rust" = true ]; then summary="rust ${summary}"; fi
          echo "toolchains=$(echo "$summary" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for the Cursor SDK
        if: steps.scan.outputs.critical_high != '0'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Write the fix-agent runner
        if: steps.scan.outputs.critical_high != '0'
        run: |
          cat > "$RUNNER_TEMP/run-cursor-agent.mjs" <<'RUNNER_EOF'
          /* __RUNNER_SCRIPT__ */
          // Runs the dependency-audit fix agent through the Cursor Agent SDK.
          //
          // Why the SDK instead of the Cursor CLI: the SDK creates a real cloud agent, so the run is
          // attributable. `cloud.metadata` tags the agent for its whole lifetime, and every usage and
          // billing export carries `cloud_agent_id`. That is what lets spend be reported per repository,
          // per use case and per ticket instead of as one undifferentiated Cursor invoice line.
          //
          // The fix work is delegated to a named subagent pinned to DeepSeek Flash: the scan already says
          // which package, which version and which lockfile, so the loop is mechanical and a large
          // frontier model buys nothing.
          //
          // The scan runs on the GitHub runner while the agent runs in its own VM, so the findings travel
          // as env vars (FINDINGS_CRITICAL_HIGH, FINDINGS_MEDIUM_LOW, TOOLCHAINS) and the verdict comes
          // back in the agent's final message. Nothing is shared through the filesystem.

          import { appendFile, readFile } from "node:fs/promises";
          import { pathToFileURL } from "node:url";
          import { Agent } from "@cursor/sdk";

          /** Model the fix subagent runs on. Fixed here; the workflow does not let callers override it. */
          const FIX_MODEL_ID = "deepseek-v4.1-flash-1017";

          /**
           * Cloud env vars are encrypted and injected per session; keeping the findings payload under
           * this cap leaves room for the rest of the environment and fails loudly if a repository has an
           * absurd number of findings rather than truncating silently.
           */
          const MAX_FINDINGS_BYTES = 60 * 1024;

          const REQUIRED_ENV = [
            "CURSOR_API_KEY",
            "REPO_URL",
            "REPO",
            "BASE_BRANCH",
            "BRANCH",
            "TICKET",
            "TRIVY_CRITICAL_HIGH_REPORT",
            "TRIVY_MEDIUM_LOW_REPORT",
            "ACCEPTED_ADVISORIES",
            "GH_TOKEN"
          ];

          function requireEnv(env, name) {
            const value = env[name];
            if (typeof value !== "string" || value.trim() === "") {
              throw new Error(`required environment variable ${name} is empty`);
            }
            return value;
          }

          /**
           * Tags persisted on the cloud agent. Keys are short and stable on purpose: they are joined
           * against Cursor usage and billing exports by `cloud_agent_id`, so renaming one silently
           * orphans the history already collected. Cursor caps metadata at 20 keys.
           */
          function agentMetadata(env) {
            return {
              repository: env.REPO,
              usecase: "dependency-update",
              ticket: env.TICKET,
              workflow: "dependency-audit",
              base_branch: env.BASE_BRANCH,
              fix_branch: env.BRANCH,
              runner: env.RUNNER || "unknown",
              run_id: env.GITHUB_RUN_ID || "local",
              run_attempt: env.GITHUB_RUN_ATTEMPT || "1",
              server_url: env.GITHUB_SERVER_URL || "https://github.com"
            };
          }

          /**
           * Trims a Trivy JSON report to the fields the agent acts on. The raw report carries package
           * paths, layer ids and long descriptions that only bloat the payload.
           */
          function compactFindings(report) {
            const findings = [];
            for (const result of report.Results ?? []) {
              for (const vulnerability of result.Vulnerabilities ?? []) {
                findings.push({
                  target: result.Target,
                  pkg: vulnerability.PkgName,
                  installed: vulnerability.InstalledVersion,
                  fixed: vulnerability.FixedVersion,
                  id: vulnerability.VulnerabilityID,
                  severity: vulnerability.Severity,
                  vendorIds: vulnerability.VendorIDs ?? []
                });
              }
            }
            return findings;
          }

          /**
           * Drops advisories the repository has already accepted, because Trivy does not read
           * `pnpm.auditConfig` and an accepted finding would otherwise send the agent to work it again.
           */
          function excludeAccepted(findings, accepted) {
            const acceptedSet = new Set(accepted);
            return findings.filter(
              (finding) => ![finding.id, ...finding.vendorIds].some((identifier) => acceptedSet.has(identifier))
            );
          }

          async function buildFindingsPayload(env) {
            const [rawCriticalHigh, rawMediumLow] = await Promise.all([
              readFile(env.TRIVY_CRITICAL_HIGH_REPORT, "utf8"),
              readFile(env.TRIVY_MEDIUM_LOW_REPORT, "utf8")
            ]);

            let accepted = [];
            try {
              const parsed = JSON.parse(env.ACCEPTED_ADVISORIES);
              if (Array.isArray(parsed)) {
                accepted = parsed.filter((value) => typeof value === "string");
              }
            } catch {
              // The workflow always writes valid JSON; an unreadable value must not stop the audit.
            }

            const payload = {
              FINDINGS_CRITICAL_HIGH: JSON.stringify(excludeAccepted(compactFindings(JSON.parse(rawCriticalHigh)), accepted)),
              FINDINGS_MEDIUM_LOW: JSON.stringify(excludeAccepted(compactFindings(JSON.parse(rawMediumLow)), accepted))
            };

            for (const [key, value] of Object.entries(payload)) {
              const bytes = Buffer.byteLength(value, "utf8");
              if (bytes > MAX_FINDINGS_BYTES) {
                throw new Error(
                  `${key} is ${bytes} bytes, above the ${MAX_FINDINGS_BYTES}-byte cloud env var cap; ` +
                    "split the scan per lockfile before running the agent"
                );
              }
            }

            return payload;
          }

          /**
           * The prompt is one string and the agent starts with no shell history, so everything it needs
           * is spelled out. The findings arrive through env vars because the scan runs on the GitHub
           * runner and the agent runs in its own VM.
           */
          function buildPrompt(env) {
            return `You fix dependency vulnerabilities in a GitHub repository. You are running as a cloud agent started by a GitHub Actions job that has already scanned the default branch.

          The repository is cloned for you. The GitHub CLI \`gh\` is authenticated through the GH_TOKEN environment variable. If \`git push\` is rejected, authenticate the remote with it:
          \`git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/${env.REPO}.git"\`

          # Context
          - Repository: \`${env.REPO}\`
          - Default branch: \`${env.BASE_BRANCH}\`
          - Fix branch: \`${env.BRANCH}\`
          - Jira ticket: \`${env.TICKET}\`
          - CRITICAL and HIGH findings, each with a fixed version: the JSON array in \`$FINDINGS_CRITICAL_HIGH\`
          - MEDIUM and LOW findings, to list only: the JSON array in \`$FINDINGS_MEDIUM_LOW\`
          - Advisory ids the repository already accepts: the JSON array in \`$ACCEPTED_ADVISORIES\`
          - Toolchains detected in the repository: \`$TOOLCHAINS\`

          Each finding has \`target\` (the lockfile path), \`pkg\`, \`installed\`, \`fixed\`, \`id\`, \`severity\` and \`vendorIds\`. Findings whose advisory id is in \`$ACCEPTED_ADVISORIES\` are already filtered out; do not re-derive them and do not re-fix them.

          # Toolchains
          Install only the toolchains named in \`$TOOLCHAINS\` before regenerating any lockfile, at the version the repository pins in \`.nvmrc\`, \`.node-version\`, \`package.json#engines\`, \`packageManager\`, \`go.mod\` or \`rust-toolchain.toml\`. The private \`@1inch\` npm registry needs a token: use \`$GH_TOKEN\` as \`NODE_AUTH_TOKEN\`, never a literal.

          # Security exceptions
          If \`SECURITY_EXCEPTIONS.md\` exists in the repository root, read it first. Skip every package it lists as an accepted risk: do not fix it and do not count it as unresolved. Mention it in the pull request body as "excepted per SECURITY_EXCEPTIONS.md".

          \`.trivyignore\` is already applied by the scan that produced these findings.

          # How to fix each CRITICAL or HIGH finding
          Work in the directory of the lockfile named in \`target\`. Use the first option that works:
          1. Bump the direct dependency in that directory's manifest (\`package.json\`, \`go.mod\` or \`Cargo.toml\`) to a version that pulls in \`fixed\`.
          2. Only when no parent bump reaches \`fixed\`: add an override (\`pnpm.overrides\`, npm \`overrides\`, Yarn \`resolutions\`, \`go get <module>@<version>\`, or \`cargo update -p <crate> --precise <version>\`) and explain why in the commit message and the pull request body.

          Regenerate the lockfile with the tool that owns it, in the same directory:
          - \`pnpm-lock.yaml\`: \`pnpm install --no-frozen-lockfile\`
          - \`package-lock.json\`: \`npm install --package-lock-only\`
          - \`yarn.lock\`: \`yarn install\`
          - \`go.mod\`: \`go mod tidy\`
          - \`Cargo.lock\`: \`cargo update -p <crate>\`

          Every lockfile is independent: never fix a nested lockfile from the root manifest.

          Verify each directory you touched by installing Trivy if it is missing (\`curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin\`) and re-scanning it, repeating until its CRITICAL and HIGH findings are gone or cannot be fixed:
          \`trivy fs --skip-db-update --scanners vuln --pkg-types library --severity CRITICAL,HIGH --ignore-unfixed <directory>\`

          # Scope
          - Fix only the CRITICAL and HIGH findings you were given.
          - Do not fix MEDIUM or LOW findings; list them in the pull request body.
          - Do not change anything unrelated to these findings, and never edit files under \`.github/workflows/\`.
          - Do not run \`pnpm audit\`, \`npm audit\` or \`yarn audit\`.

          # Branch
          1. If \`${env.BRANCH}\` exists on origin (\`git ls-remote --exit-code --heads origin "${env.BRANCH}"\`): fetch it, check it out and rebase it onto \`origin/${env.BASE_BRANCH}\`. Never delete or recreate it.
          2. Otherwise create it from \`origin/${env.BASE_BRANCH}\`.
          3. Commit with the message \`fix(${env.TICKET}): resolve critical and high dependency vulnerabilities\` and push with \`git push --force-with-lease origin "${env.BRANCH}"\`. Never use \`git push --force\`.

          # Pull request
          Keep exactly one open pull request from \`${env.BRANCH}\` into \`${env.BASE_BRANCH}\`:
          - If \`gh pr list --head "${env.BRANCH}" --base "${env.BASE_BRANCH}" --state open --json number\` returns one, update its body with \`gh pr edit\`. Never create a second one.
          - Otherwise create it with \`gh pr create --base "${env.BASE_BRANCH}" --head "${env.BRANCH}" --title "fix(${env.TICKET}): resolve critical and high dependency vulnerabilities"\`.

          The pull request body must contain:
          - \`Tracked in ${env.TICKET}.\`
          - A table with the columns Lockfile, Package, Installed, Fixed, Advisory, Severity, Fix applied.
          - Whether every CRITICAL and HIGH finding is resolved, and the reason for each one that is not.
          - The MEDIUM and LOW findings in a collapsed \`<details>\` list.

          If nothing needs changing because every finding is excepted, do not push and do not open a pull request.

          # Delegation
          Do the mechanical bump-and-regenerate work through the \`dependency-fixer\` subagent, which runs on a fast, cheap model. Keep the planning, the verification, the commit, the push and the pull request body yourself.

          # Result
          End your final message with a single fenced \`json\` block holding exactly these keys:
          - \`unresolvedCriticalHigh\`: boolean, true when any CRITICAL or HIGH finding that is not excepted remains.
          - \`pullRequestUrl\`: string, the pull request you opened or updated, or an empty string when you did not push.
          - \`summary\`: string, one or two sentences naming what you changed.
          Do not put this block anywhere else and do not commit it to the repository.`;
          }

          /**
           * The fix subagent. DeepSeek Flash is ample for this loop and far cheaper than the account
           * default, while the parent agent keeps the default model so the plan, the verification and the
           * pull request body stay coherent.
           */
          function subagents() {
            return {
              "dependency-fixer": {
                description:
                  "Fixes CRITICAL and HIGH dependency findings: bumps the parent dependency or adds an override, regenerates the owning lockfile, and verifies with a re-scan.",
                model: { id: FIX_MODEL_ID },
                prompt: `You fix dependency vulnerabilities in a checked-out repository. You are a subagent: the parent agent has already established the scope, the findings and the branch, and will handle the commit, the push and the pull request.

          For every CRITICAL or HIGH finding you are given:
          1. Work in the directory that owns the vulnerable lockfile. Every lockfile is independent, so never fix a nested lockfile from the root manifest.
          2. Prefer bumping the direct dependency in that directory's manifest. Add an override (\`pnpm.overrides\`, npm \`overrides\`, Yarn \`resolutions\`, \`go get <module>@<version>\`, \`cargo update -p <crate> --precise <version>\`) only when no parent bump reaches the fixed version, and say why when you do.
          3. Regenerate the lockfile with the tool that owns it: \`pnpm install --no-frozen-lockfile\`, \`npm install --package-lock-only\`, \`yarn install\`, \`go mod tidy\`, or \`cargo update -p <crate>\`.
          4. Re-scan that directory and repeat until its CRITICAL and HIGH findings are gone or cannot be fixed.

          Report back, per finding, the package, the installed version, the fixed version, the advisory id and what you did. Say plainly which findings you could not fix and why. Do not run \`pnpm audit\`, \`npm audit\` or \`yarn audit\`. Do not touch anything unrelated to these findings, and never edit files under \`.github/workflows/\`.`
              }
            };
          }

          /**
           * Builds the job-summary markdown. Pure, so tests can assert on it without a network call.
           */
          function buildReport({ repo, ticket, branch, agentId, modelId, result, usage }) {
            const lines = [
              "### Dependency audit fix agent",
              "",
              "| Field | Value |",
              "| --- | --- |",
              `| Repository | \`${repo}\` |`,
              `| Ticket | \`${ticket}\` |`,
              `| Branch | \`${branch}\` |`,
              `| Cloud agent | \`${agentId}\` |`,
              `| Fix subagent model | \`${modelId}\` |`,
              `| Status | ${result.status} |`
            ];

            if (typeof result.durationMs === "number") {
              lines.push(`| Duration | ${Math.round(result.durationMs / 1000)}s |`);
            }

            if (usage) {
              lines.push(
                `| Tokens | ${usage.inputTokens} in / ${usage.outputTokens} out / ${usage.cacheReadTokens} cache read |`
              );
            }

            if (result.git?.branches?.length) {
              const branches = result.git.branches
                .map((entry) => (entry.prUrl ? `${entry.branch} (${entry.prUrl})` : entry.branch))
                .filter(Boolean)
                .join(", ");
              if (branches) {
                lines.push(`| Git | ${branches} |`);
              }
            }

            lines.push(
              "",
              `The tags on cloud agent \`${agentId}\` are what let usage and billing exports be joined to the repository, the use case and the ticket.`
            );
            return lines.join("\n");
          }

          /**
           * Pulls the verdict out of the agent's final message. It is the last fenced json block, or the
           * last JSON object if the model ignored the fence. Anything unreadable is treated as unresolved:
           * reporting "resolved" there would hide findings the agent never judged.
           */
          function parseVerdict(text) {
            if (typeof text !== "string" || text.trim() === "") {
              return undefined;
            }

            const blocks = [...text.matchAll(/```json\s*([\s\S]*?)```/gi)].map((match) => match[1]);
            for (const candidate of [...blocks.reverse(), text]) {
              const start = candidate.indexOf("{");
              const end = candidate.lastIndexOf("}");
              if (start === -1 || end <= start) {
                continue;
              }
              try {
                const parsed = JSON.parse(candidate.slice(start, end + 1));
                if (parsed && typeof parsed === "object" && "unresolvedCriticalHigh" in parsed) {
                  return {
                    unresolvedCriticalHigh: parsed.unresolvedCriticalHigh !== false,
                    pullRequestUrl: typeof parsed.pullRequestUrl === "string" ? parsed.pullRequestUrl : "",
                    summary: typeof parsed.summary === "string" ? parsed.summary : ""
                  };
                }
              } catch {
                // Try the next candidate: a fenced block that is not the verdict is not fatal.
              }
            }
            return undefined;
          }

          /**
           * Turns a finished run into job outputs. A run that did not finish, or whose final message holds
           * no verdict, counts as unresolved.
           */
          function collectResult({ status, error, text, git }) {
            const gitPullRequest = git?.branches?.find((branch) => typeof branch.prUrl === "string" && branch.prUrl !== "")?.prUrl ?? "";

            if (status !== "finished") {
              return {
                unresolvedCriticalHigh: true,
                pullRequestUrl: gitPullRequest,
                summary: `agent run ended with status ${status}${error?.message ? `: ${error.message}` : ""}`
              };
            }

            const verdict = parseVerdict(text);
            if (!verdict) {
              return {
                unresolvedCriticalHigh: true,
                pullRequestUrl: gitPullRequest,
                summary: "agent finished without a readable verdict in its final message"
              };
            }

            return {
              ...verdict,
              pullRequestUrl: verdict.pullRequestUrl || gitPullRequest
            };
          }

          async function main() {
            const env = {};
            for (const name of REQUIRED_ENV) {
              env[name] = requireEnv(process.env, name);
            }
            for (const name of [
              "RUNNER",
              "TOOLCHAINS",
              "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT",
              "GITHUB_SERVER_URL",
              "GITHUB_ENV",
              "GITHUB_OUTPUT",
              "GITHUB_STEP_SUMMARY"
            ]) {
              env[name] = process.env[name];
            }

            const findings = await buildFindingsPayload(env);

            const agent = await Agent.create({
              apiKey: env.CURSOR_API_KEY,
              name: `${env.REPO} dependency audit`,
              cloud: {
                repos: [{ url: env.REPO_URL, startingRef: env.BASE_BRANCH }],
                autoCreatePR: false,
                skipReviewerRequest: true,
                metadata: agentMetadata(env),
                // The PAT is here so `gh` can read and write pull requests. Names may not start with
                // CURSOR_, so the injected name is GH_TOKEN.
                envVars: {
                  GH_TOKEN: env.GH_TOKEN,
                  TOOLCHAINS: env.TOOLCHAINS || "unknown",
                  ...findings
                }
              },
              agents: subagents()
            });

            // `Agent.create()` resolves before the VM is provisioned, so log the id immediately: a run
            // that dies during provisioning is otherwise untraceable from the job log.
            process.stdout.write(`cloud agent ${agent.agentId} created for ${env.REPO}\n`);

            try {
              const run = await agent.send(buildPrompt(env));
              const result = await run.wait();

              let usage = result.usage;
              if (!usage) {
                try {
                  usage = (await agent.getUsage()).usage;
                } catch (usageError) {
                  process.stdout.write(`agent usage unavailable: ${usageError.message}\n`);
                }
              }

              const collected = collectResult({
                status: result.status,
                error: result.error,
                text: result.result,
                git: result.git
              });

              const outputs = [
                `unresolved_critical_high=${collected.unresolvedCriticalHigh}`,
                `pull_request_url=${collected.pullRequestUrl}`,
                `agent_id=${agent.agentId}`,
                `agent_status=${result.status}`
              ].join("\n");

              await appendFile(env.GITHUB_OUTPUT ?? "/dev/null", `${outputs}\n`);
              await appendFile(
                env.GITHUB_ENV ?? "/dev/null",
                `UNRESOLVED_CRITICAL_HIGH=${collected.unresolvedCriticalHigh}\n`
              );
              await appendFile(
                env.GITHUB_STEP_SUMMARY ?? "/dev/null",
                `${buildReport({
                  repo: env.REPO,
                  ticket: env.TICKET,
                  branch: env.BRANCH,
                  agentId: agent.agentId,
                  modelId: FIX_MODEL_ID,
                  result,
                  usage
                })}\n`
              );

              if (collected.summary) {
                process.stdout.write(`${collected.summary}\n`);
              }
              process.exitCode = collected.unresolvedCriticalHigh || result.status !== "finished" ? 1 : 0;
            } finally {
              agent.close();
            }
          }

          export {
            FIX_MODEL_ID,
            MAX_FINDINGS_BYTES,
            agentMetadata,
            buildFindingsPayload,
            buildPrompt,
            buildReport,
            collectResult,
            compactFindings,
            excludeAccepted,
            parseVerdict,
            subagents
          };

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            await main();
          }
          RUNNER_EOF

      - name: Run the fix agent through the Cursor SDK
        id: agent
        if: steps.scan.outputs.critical_high != '0'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.DEPENDENCY_AUDIT_PAT }}
          TOOLCHAINS: ${{ steps.toolchains.outputs.toolchains }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "@cursor/sdk@$CURSOR_SDK_VERSION"
          node "$RUNNER_TEMP/run-cursor-agent.mjs"

      - name: Fail if critical or high vulnerabilities remain
        if: steps.scan.outputs.critical_high != '0'
        run: |
          if [ "${UNRESOLVED_CRITICAL_HIGH:-true}" != "false" ]; then
            echo "::error::Critical or high vulnerabilities remain unresolved. See the open pull request from $BRANCH."
            exit 1
          fi
          echo "No unresolved critical or high vulnerabilities."
